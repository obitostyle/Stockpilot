[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpilot"
version = "0.7.1"
description = "StockPilot - Sistema desktop de gestão para pequenos comércios"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "SQLAlchemy>=2.0",
  "pydantic>=2.5",
  "platformdirs>=4.0",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0", "pyinstaller>=6.0"]

[project.scripts]
stockpilot = "stockpilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
