name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Executável (PyInstaller)
        run: python -m PyInstaller stockpilot.spec --noconfirm --clean
      - name: Autoteste do executável
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process dist\StockPilotAI\StockPilotAI.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\stockpilot-selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Instalador (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c "from stockpilot import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer\stockpilot.iss
      - uses: actions/upload-artifact@v4
        with:
          name: StockPilotAI-Setup
          path: dist_installer/*.exe
